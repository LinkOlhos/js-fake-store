<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Falsa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <header class="flex items-center justify-between px-15 py-4 bg-blue-600">
        <div>
            <input type="text" placeholder="Digite o nome do produto" class="w-120 h-10 rounded bg-white px-4">   
        </div>

        <div>
            <select id="categorias" class="h-10 rounded bg-white px-4">
                <option>men's clothing</option>
                <option>women's clothing</option>
                <option>electronics</option>
                <option>jewelery</option>
            </select>
            <select id="ordenação" class="h-10 rounded bg-white px-4">
                <option value="preco">Ordenar por preço</option>
                <option value="nota">Ordernar por avaliação</option>
            </select>
        </div>
    </header>

    <main class="p-15">
        <div id="cards" class="grid grid-cols-4 gap-4">
            <div class="bg-white">
                <div class="relative">
                    <img src="https://fakestoreapi.com/img/81fPKd-2AYL._AC_SL1500_t.png" alt="" class="w-full h-55 object-contain">
                    <div class="p-2 bg-blue-600 text-white font-bold absolute top-3 right-3 rounded">4.0</div>
                </div>
                <div class="pt-4">
                    <h2 class="font-semibold text-xl">Nome do produto</h2>
                    <h6 class="font-bold">Categoria</h6>
                    <h6 class="text-right text-2x1">R$ 0.00</h6>
                </div>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
